<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>身障/長照 補助計算機 V43</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4A90E2">
  <link rel="apple-touch-icon" href="./icon.png">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { touch-action: manipulation; background-color: #f3f4f6; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .loading-spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback } = React;

    // 圖示
    const IconBase = ({ children, size = 18, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Trash2 = (p) => <IconBase {...p}><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6" /></IconBase>;
    const Plus = (p) => <IconBase {...p}><path d="M12 5v14M5 12h14" /></IconBase>;
    const RefreshCw = (p) => <IconBase {...p}><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></IconBase>;
    const CheckSquare = (p) => <IconBase {...p}><path d="M9 11l3 3L22 4" /><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" /></IconBase>;
    const Square = (p) => <IconBase {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /></IconBase>;
    const CheckCircle = (p) => <IconBase {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></IconBase>;
    const Circle = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"></circle></IconBase>;
    const ChevronUp = (p) => <IconBase {...p}><path d="M18 15l-6-6-6 6" /></IconBase>;
    const ChevronDown = (p) => <IconBase {...p}><path d="M6 9l6 6 6-6" /></IconBase>;
    const Info = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></IconBase>;
    const Smartphone = (p) => <IconBase {...p} size={80}><path d="M5 2h14a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 15h.01" /></IconBase>;

    const Card = ({ title, value, colorClass = "", isWarning = false }) => (
      <div className={`flex flex-col items-center p-1 border border-blue-800 rounded shadow-sm w-full transition-colors ${isWarning ? 'bg-yellow-300 font-bold text-red-600' : 'bg-white text-black'}`}>
        <div className="text-[10px] whitespace-nowrap mb-1 font-bold">{title}</div>
        <div className={`text-sm font-black px-1 border border-black w-full text-center truncate bg-white ${colorClass}`}>
          {value}
        </div>
      </div>
    );

    function App() {
      const [db, setDb] = useState({ equip: [], disConst: [], ltcConst: [], lastUpdate: '未同步' });
      const [isLoading, setIsLoading] = useState(true);
      const [isSyncing, setIsSyncing] = useState(false);
      const [disabilityStatus, setDisabilityStatus] = useState('');
      const [ltcStatus, setLtcStatus] = useState('');
      const [constApplyMode, setConstApplyMode] = useState('LTC');
      const [isEquipOpen, setIsEquipOpen] = useState(true);

      const getInitRows = (base) => [
        { id: base+1, productId: '', ltcChecked: false, disChecked: false, quantity: 1 },
        { id: base+2, productId: '', ltcChecked: false, disChecked: false, quantity: 1 },
        { id: base+3, productId: '', ltcChecked: false, disChecked: false, quantity: 1 }
      ];

      const [equipRows, setEquipRows] = useState(() => getInitRows(100));
      const [ltcConstRows, setLtcConstRows] = useState(() => getInitRows(200));
      const [disConstRows, setDisConstRows] = useState(() => getInitRows(300));

      const syncData = useCallback(async (isManual = false) => {
        if (isSyncing) return;
        setIsSyncing(true);
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 12000);
        try {
          const fetchCSV = async (u) => {
            const r = await fetch(u, { signal: controller.signal });
            const t = await r.text();
            return t.split(/\r?\n/).map(l => l.split(','));
          };
          const [rawE, rawD, rawL] = await Promise.all([
            fetchCSV("https://docs.google.com/spreadsheets/d/e/2PACX-1vSc52n0bHfF-AtmLmVLrTkhTjNTPT383WW_x1Mb53OAxPLdaeeDtrRHidAj-rQvDX2XRzxkEo2vDETV/pub?gid=0&single=true&output=csv"),
            fetchCSV("https://docs.google.com/spreadsheets/d/e/2PACX-1vSc52n0bHfF-AtmLmVLrTkhTjNTPT383WW_x1Mb53OAxPLdaeeDtrRHidAj-rQvDX2XRzxkEo2vDETV/pub?gid=902315114&single=true&output=csv"),
            fetchCSV("https://docs.google.com/spreadsheets/d/e/2PACX-1vSc52n0bHfF-AtmLmVLrTkhTjNTPT383WW_x1Mb53OAxPLdaeeDtrRHidAj-rQvDX2XRzxkEo2vDETV/pub?gid=1335611083&single=true&output=csv")
          ]);
          const equip = rawE.slice(2).filter(r => r[0]).map((r, i) => ({
            id: `p${i}`, name: r[0],
            prices: { disability: { '一般戶': +r[1]||0, '中低收': +r[2]||0, '低收入戶': +r[3]||0 }, ltc: { '一般戶': +r[4]||0, '中低收': +r[5]||0, '低收入戶': +r[6]||0 } },
            years: r[7] || '-', ltcQuota: +r[6] || 0
          }));
          const parseC = (raw) => raw.slice(1).filter(r => r[0]).map((r, i) => ({
            id: `c${i}`, name: r[0], prices: { '一般戶': +r[1]||0, '中低收': +r[2]||0, '低收入戶': +r[3]||0 }, quota: +r[3]||0
          }));
          const newDb = { equip, disConst: parseC(rawD), ltcConst: parseC(rawL), lastUpdate: new Date().toLocaleDateString('zh-TW', {month:'2-digit', day:'2-digit'}) };
          localStorage.setItem('subsidy_db_v43', JSON.stringify(newDb));
          setDb(newDb);
          setIsSyncing(false);
          setTimeout(() => { if (isManual) alert("基準表同步成功！"); }, 100);
        } catch (e) {
          setIsSyncing(false);
          if (isManual) alert("同步失敗，請檢查網路。");
        } finally {
          clearTimeout(timeoutId);
          setIsLoading(false);
        }
      }, [isSyncing]);

      useEffect(() => {
        const cache = localStorage.getItem('subsidy_db_v43');
        if (cache) { setDb(JSON.parse(cache)); setIsLoading(false); }
        else { syncData(); }
      }, [syncData]);

      const calcEquip = useMemo(() => equipRows.map(row => {
        const p = db.equip.find(x => x.id === row.productId);
        if (!p || !disabilityStatus || !ltcStatus) return { ...row, lp: 0, dp: 0, q: 0, y: '-', df: 0 };
        const lp = p.prices.ltc[ltcStatus], dp = p.prices.disability[disabilityStatus];
        return { ...row, lp, dp, q: p.ltcQuota, y: p.years, df: lp - dp, aL: row.ltcChecked ? lp : 0, aD: row.disChecked ? dp : 0, aQ: row.ltcChecked ? p.ltcQuota : 0 };
      }), [equipRows, disabilityStatus, ltcStatus, db.equip]);

      const totals = useMemo(() => {
        const eT = calcEquip.reduce((acc, r) => ({ d: acc.d + (r.aD||0), l: acc.l + (r.aL||0), q: acc.q + (r.aQ||0) }), { d: 0, l: 0, q: 0 });
        const lS = ltcConstRows.reduce((acc, r) => {
          const p = db.ltcConst.find(x => x.id === r.productId);
          const qty = Number(r.quantity) || 0;
          return { p: acc.p + (p ? p.prices[ltcStatus] * qty : 0), q: acc.q + (p ? p.quota * qty : 0) };
        }, { p: 0, q: 0 });
        const dS = disConstRows.reduce((acc, r) => {
          const p = db.disConst.find(x => x.id === r.productId);
          const qty = Number(r.quantity) || 0;
          return acc + (p ? p.prices[disabilityStatus] * qty : 0);
        }, 0);
        const cL = constApplyMode === 'LTC' ? lS.p : 0, cD = constApplyMode === 'DISABILITY' ? dS : 0;
        let diffLabel = "金額相同", diffColor = "text-gray-500";
        if (lS.p === 0 && dS === 0) { diffLabel = "金額相同"; }
        else if (lS.p > dS) { diffLabel = `長照優 (+${lS.p - dS})`; diffColor = "text-blue-700"; }
        else if (dS > lS.p) { diffLabel = `身障優 (+${dS - lS.p})`; diffColor = "text-green-700"; }
        return { disTotal: eT.d + cD, ltcTotal: eT.l + cL, quotaTotal: eT.q + (constApplyMode === 'LTC' ? lS.q : 0), diffLabel, diffColor, lSub: lS.p, lQ: lS.q, dSub: dS };
      }, [calcEquip, ltcConstRows, disConstRows, constApplyMode, ltcStatus, disabilityStatus, db]);

      const clearAction = (type) => {
        if (type === 'ECON') { setDisabilityStatus(''); setLtcStatus(''); }
        else if (type === 'EQUIP') setEquipRows(getInitRows(Date.now()));
        else if (type === 'CONST') { setLtcConstRows(getInitRows(Date.now()+100)); setDisConstRows(getInitRows(Date.now()+200)); }
        else if (type === 'LTC_CH') setEquipRows(equipRows.map(r=>({...r, ltcChecked:false})));
        else if (type === 'DIS_CH') setEquipRows(equipRows.map(r=>({...r, disChecked:false})));
        else { setDisabilityStatus(''); setLtcStatus(''); setEquipRows(getInitRows(Date.now())); setLtcConstRows(getInitRows(Date.now()+100)); setDisConstRows(getInitRows(Date.now()+200)); }
      };

      if (isLoading) return <div className="h-screen flex flex-col items-center justify-center bg-gray-900 text-white"><RefreshCw size={48} className="mb-4 text-blue-400 loading-spin" /><p>系統載入中...</p></div>;

      return (
        <div className="p-2 no-scrollbar">
          <div className="portrait:flex landscape:hidden fixed inset-0 z-[9999] bg-gray-900 text-white flex flex-col items-center justify-center p-8 text-center"><RefreshCw className="mb-6 text-yellow-400 animate-pulse" /><h2>請橫向使用裝置</h2><Smartphone className="mt-8 text-gray-700 rotate-90" /></div>
          <div className="landscape:block hidden w-full pb-10" id="main-content">
            <div className="sticky top-0 z-50 bg-white rounded-lg shadow-md mb-3 border border-gray-300 mt-2 overflow-hidden">
              <div className="bg-blue-600 text-white p-1.5 text-center font-bold text-sm relative">身障/長照 補助計算機 V43<div className="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-2"><span className="text-[9px] opacity-70 font-normal">基準表: {db.lastUpdate}</span><button onClick={() => syncData(true)} className="hover:bg-white/20 p-1 rounded" disabled={isSyncing}><RefreshCw size={14} className={isSyncing ? "loading-spin" : ""} /></button></div></div>
              <div className="p-2">
                <div className="flex items-end gap-2 mb-2">
                  <div className="w-32"><label className="text-[10px] font-bold block text-gray-700">身障經濟別</label><select className="w-full border rounded p-1 text-xs h-8 bg-gray-50" value={disabilityStatus} onChange={e=>setDisabilityStatus(e.target.value)}><option value="">請選擇...</option>{['一般戶','中低收','低收入戶'].map(s=><option key={s}>{s}</option>)}</select></div>
                  <div className="w-32"><label className="text-[10px] font-bold block text-gray-700">長照經濟別</label><select className="w-full border rounded p-1 text-xs h-8 bg-gray-50" value={ltcStatus} onChange={e=>setLtcStatus(e.target.value)}><option value="">請選擇...</option>{['一般戶','中低收','低收入戶'].map(s=><option key={s}>{s}</option>)}</select></div>
                  <div className="flex gap-1 flex-1"><Card title="身障總補助金額" value={totals.disTotal} /><Card title="長照總補助金額" value={totals.ltcTotal} /><Card title="總補助金額" value={totals.disTotal + totals.ltcTotal} /><Card title="長照占用總額度" value={totals.quotaTotal} isWarning={totals.quotaTotal > 40000} /></div>
                </div>
                {totals.quotaTotal > 40000 && <div className="text-red-600 font-bold text-[10px] mb-2 text-center bg-yellow-100 p-1 rounded border border-red-300">⚠️ 長照額度超額，實際總補助金額可能不準確</div>}
                <div className="flex flex-wrap gap-1 items-center">
                  <button onClick={()=>clearAction('ECON')} className="px-2 py-1.5 rounded text-white font-bold text-[10px] bg-gray-600 shadow">經濟別清除</button>
                  <button onClick={()=>clearAction('EQUIP')} className="px-2 py-1.5 rounded text-white font-bold text-[10px] bg-sky-600 shadow">輔具區清除</button>
                  <button onClick={()=>clearAction('CONST')} className="px-2 py-1.5 rounded text-white font-bold text-[10px] bg-orange-600 shadow">無障礙區清除</button>
                  <button onClick={()=>clearAction('LTC_CH')} className="px-2 py-1.5 rounded text-white font-bold text-[10px] bg-blue-400 shadow">長照勾勾清除</button>
                  <button onClick={()=>clearAction('DIS_CH')} className="px-2 py-1.5 rounded text-white font-bold text-[10px] bg-emerald-600 shadow">身障勾勾清除</button>
                  <button onClick={()=>clearAction('ALL')} className="px-2 py-1.5 rounded text-white font-bold text-[10px] bg-red-600 shadow">總清除</button>
                  <button onClick={()=>{window.scrollTo(0,0); htmlToImage.toPng(document.getElementById('main-content'),{backgroundColor:'#f3f4f6'}).then(u=>{const l=document.createElement('a');l.download=`試算_${new Date().toLocaleDateString()}.png`;l.href=u;l.click();})}} className="px-2 py-1.5 rounded text-white bg-purple-600 text-[10px] font-bold ml-auto shadow">一鍵截圖</button>
                </div>
              </div>
            </div>

            <div className="mb-3 bg-white rounded shadow border border-blue-200 overflow-hidden">
              <div className="bg-blue-100 p-2 flex justify-between items-center cursor-pointer" onClick={()=>setIsEquipOpen(!isEquipOpen)}><span className="font-bold text-blue-900 text-sm">輔具清單</span><div className="flex gap-2"><button onClick={(e)=>{e.stopPropagation(); setEquipRows([...equipRows,{id:Date.now(),productId:'',ltcChecked:false,disChecked:false}]);}} className="bg-green-600 text-white px-2 py-0.5 rounded text-xs shadow hover:bg-green-700">+ 新增</button>{isEquipOpen?<ChevronUp/>:<ChevronDown/>}</div></div>
              {isEquipOpen && (
                <div>
                  <div className="flex bg-blue-50 text-[10px] font-bold p-1 text-center border-b text-blue-900">
                    <div className="w-[28%] text-left pl-1">項目名稱</div><div className="w-[5%]">長照</div><div className="w-[10%]">長照金額</div><div className="w-[5%]">身障</div><div className="w-[10%]">身障金額</div><div className="w-[7%] text-blue-600">年限</div><div className="w-[11%]">差額</div><div className="w-[12%]">長照占用額度</div><div className="w-[12%]">操作</div>
                  </div>
                  {calcEquip.map(row => (
                    <div key={row.id} className="flex items-center text-xs p-1 border-b hover:bg-blue-50/50 gap-0.5">
                      <div className="w-[28%] p-0.5"><select className="w-full border border-blue-800 rounded text-[11px] h-8 bg-white font-bold" value={row.productId} onChange={e=>setEquipRows(equipRows.map(r=>r.id===row.id?{...r,productId:e.target.value}:r))}><option value="">請選擇...</option>{db.equip.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
                      <div className="w-[5%] flex justify-center"><button onClick={()=>{const n=!row.ltcChecked; setEquipRows(equipRows.map(r=>r.id===row.id?{...r,ltcChecked:n,disChecked:n?false:r.disChecked}:r))}}>{row.ltcChecked?<CheckSquare className="text-blue-600"/>:<Square className="text-gray-300"/>}</button></div>
                      <div className="w-[10%] border bg-white py-1 rounded text-center truncate">{row.lp}</div>
                      <div className="w-[5%] flex justify-center"><button onClick={()=>{const n=!row.disChecked; setEquipRows(equipRows.map(r=>r.id===row.id?{...r,disChecked:n,ltcChecked:n?false:r.ltcChecked}:r))}}>{row.disChecked?<CheckSquare className="text-green-600"/>:<Square className="text-gray-300"/>}</button></div>
                      <div className="w-[10%] border bg-white py-1 rounded text-center truncate">{row.dp}</div>
                      <div className="w-[7%] text-center font-bold text-blue-600">{row.y}</div>
                      <div className="w-[11%] border bg-white py-1 rounded text-center truncate">{row.df}</div>
                      <div className="w-[12%] border bg-white py-1 rounded text-center truncate">{row.q}</div>
                      <div className="w-[12%] flex justify-center"><button onClick={()=>setEquipRows(equipRows.filter(r=>r.id!==row.id))} className="text-red-500 hover:text-red-700 transition-colors"><Trash2/></button></div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="mb-3 bg-white p-2 rounded shadow border flex items-center gap-4 border-gray-300">
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-gray-700">無障礙申請管道：</span>
                <div className="border px-2 py-1 rounded bg-gray-50 flex items-center gap-1 shadow-sm"><Info size={14} className="text-gray-500"/><span className={`text-xs font-bold ${totals.diffColor}`}>{totals.diffLabel}</span></div>
              </div>
              <div className="flex gap-4 ml-auto items-center">
                <label className="flex items-center gap-1 cursor-pointer text-xs font-bold text-blue-700" onClick={()=>setConstApplyMode('LTC')}>{constApplyMode==='LTC'?<CheckCircle className="text-blue-600"/>:<Circle className="text-gray-300"/>} 從長照申請</label>
                <label className="flex items-center gap-1 cursor-pointer text-xs font-bold text-green-700" onClick={()=>setConstApplyMode('DISABILITY')}>{constApplyMode==='DISABILITY'?<CheckCircle className="text-green-600"/>:<Circle className="text-gray-300"/>} 從身障申請</label>
              </div>
            </div>

            <div className="mb-3 bg-white rounded shadow border border-blue-300 overflow-hidden">
              <div className="bg-blue-50 p-2 flex justify-between items-center font-bold text-blue-800">
                <span className="text-sm">長照無障礙項目</span>
                <div className="flex gap-2">
                  <div className="bg-white border border-blue-200 rounded px-1.5 py-0.5 text-[10px] flex flex-col items-end shadow-sm"><span className="text-gray-500 scale-90 text-[8px]">長照補助金額</span><span className="text-blue-700">{totals.lSub}</span></div>
                  <div className="bg-white border border-blue-200 rounded px-1.5 py-0.5 text-[10px] flex flex-col items-end shadow-sm"><span className="text-gray-500 scale-90 text-[8px]">長照佔用額度</span><span>{totals.lQ}</span></div>
                  <button onClick={()=>setLtcConstRows([...ltcConstRows,{id:Date.now(),productId:'',quantity:1}])} className="bg-blue-600 text-white px-2 py-0.5 rounded text-xs shadow hover:bg-blue-700">+ 新增</button>
                </div>
              </div>
              <div className="min-w-[800px]"><div className="flex bg-gray-50 p-1 font-bold text-[10px] text-center border-b text-gray-700"><div className="w-[30%] text-left pl-1">項目</div><div className="w-[15%]">單組金額</div><div className="w-[10%]">組數</div><div className="w-[15%]">單項金額</div><div className="w-[15%]">單項額度</div><div className="w-[15%]">操作</div></div>
                {ltcConstRows.map(r => { const p=db.ltcConst.find(x=>x.id===r.productId); const up=p?p.prices[ltcStatus]:0; const uq=p?p.quota:0; return (
                  <div key={r.id} className="flex items-center text-xs p-1 border-b hover:bg-blue-50/30"><div className="w-[30%] p-0.5"><select className="w-full border rounded h-8 text-[11px] bg-white font-bold" value={r.productId} onChange={e=>setLtcConstRows(ltcConstRows.map(x=>x.id===r.id?{...x,productId:e.target.value}:x))}><option value="">請選擇...</option>{db.ltcConst.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div><div className="w-[15%] text-center text-gray-600">{up}</div><div className="w-[10%] px-0.5"><input type="number" className="w-full border rounded text-center h-8 font-bold" value={r.quantity} onFocus={(e)=>e.target.select()} onChange={e=>setLtcConstRows(ltcConstRows.map(x=>x.id===r.id?{...x,quantity:e.target.value===''?'':Number(e.target.value)}:x))}/></div><div className="w-[15%] text-center text-blue-700 font-bold border py-1.5 rounded mx-1 bg-white">{(up*(Number(r.quantity)||0))}</div><div className="w-[15%] text-center text-gray-600 border py-1.5 rounded mx-1 bg-white">{(uq*(Number(r.quantity)||0))}</div><div className="w-[15%] flex justify-center"><button onClick={()=>setLtcConstRows(ltcConstRows.filter(x=>x.id!==r.id))} className="text-red-500 hover:text-red-700"><Trash2/></button></div></div>
                );})}</div></div>

            <div className="mb-10 bg-white rounded shadow border border-green-300 overflow-hidden">
              <div className="bg-green-50 p-2 flex justify-between items-center font-bold text-green-800">
                <span className="text-sm">身障無障礙項目</span>
                <div className="flex gap-2">
                  <div className="bg-white border border-green-200 rounded px-1.5 py-0.5 text-[10px] flex flex-col items-end shadow-sm"><span className="text-gray-500 scale-90 text-[8px]">身障補助金額</span><span className="text-green-700">{totals.dSub}</span></div>
                  <button onClick={()=>setDisConstRows([...disConstRows,{id:Date.now(),productId:'',quantity:1}])} className="bg-green-600 text-white px-2 py-0.5 rounded text-xs shadow hover:bg-green-700">+ 新增</button>
                </div>
              </div>
              <div className="min-w-[800px]"><div className="flex bg-gray-50 p-1 font-bold text-[10px] text-center border-b text-gray-700"><div className="w-[45%] text-left pl-1">項目</div><div className="w-[15%]">單組金額</div><div className="w-[10%]">組數</div><div className="w-[15%]">單項金額</div><div className="w-[15%]">操作</div></div>
                {disConstRows.map(r => { const p=db.disConst.find(x=>x.id===r.productId); const up=p?p.prices[disabilityStatus]:0; return (
                  <div key={r.id} className="flex items-center text-xs p-1 border-b hover:bg-green-50/30"><div className="w-[45%] p-0.5"><select className="w-full border rounded h-8 text-[11px] bg-white font-bold" value={r.productId} onChange={e=>setDisConstRows(disConstRows.map(x=>x.id===r.id?{...x,productId:e.target.value}:x))}><option value="">請選擇...</option>{db.disConst.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div><div className="w-[15%] text-center text-gray-600">{up}</div><div className="w-[10%] px-0.5"><input type="number" className="w-full border rounded text-center h-8 font-bold" value={r.quantity} onFocus={(e)=>e.target.select()} onChange={e=>setDisConstRows(disConstRows.map(x=>x.id===r.id?{...x,quantity:e.target.value===''?'':Number(e.target.value)}:x))}/></div><div className="w-[15%] text-center text-green-700 font-bold border py-1.5 rounded mx-1 bg-white">{(up*(Number(r.quantity)||0))}</div><div className="w-[15%] flex justify-center"><button onClick={()=>setDisConstRows(disConstRows.filter(x=>x.id!==r.id))} className="text-red-500 hover:text-red-700"><Trash2/></button></div></div>
                );})}</div></div>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./service-worker.js'); }
  </script>
</body>
</html>
