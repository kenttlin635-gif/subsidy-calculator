<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>輔具補助計算器 V31</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4A90E2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon.png">

  <!-- 載入 React, Tailwind 和 html-to-image -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { touch-action: manipulation; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .loading-spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const CSV_URLS = {
      EQUIP: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSc52n0bHfF-AtmLmVLrTkhTjNTPT383WW_x1Mb53OAxPLdaeeDtrRHidAj-rQvDX2XRzxkEo2vDETV/pub?gid=0&single=true&output=csv",
      DIS_CONST: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSc52n0bHfF-AtmLmVLrTkhTjNTPT383WW_x1Mb53OAxPLdaeeDtrRHidAj-rQvDX2XRzxkEo2vDETV/pub?gid=902315114&single=true&output=csv",
      LTC_CONST: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSc52n0bHfF-AtmLmVLrTkhTjNTPT383WW_x1Mb53OAxPLdaeeDtrRHidAj-rQvDX2XRzxkEo2vDETV/pub?gid=1335611083&single=true&output=csv"
    };

    // --- 圖示組件 ---
    const IconBase = ({ children, size = 18, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Trash2 = (p) => <IconBase {...p}><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6" /></IconBase>;
    const Plus = (p) => <IconBase {...p}><path d="M12 5v14M5 12h14" /></IconBase>;
    const RefreshCw = (p) => <IconBase {...p} className="loading-spin"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></IconBase>;
    const CheckSquare = (p) => <IconBase {...p}><path d="M9 11l3 3L22 4" /><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" /></IconBase>;
    const Square = (p) => <IconBase {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /></IconBase>;
    const CheckCircle = (p) => <IconBase {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></IconBase>;
    const Circle = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"></circle></IconBase>;
    const Info = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></IconBase>;
    const Smartphone = (p) => <IconBase {...p} size={80}><path d="M5 2h14a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 15h.01" /></IconBase>;

    const ECON_STATUS = ['一般戶', '中低收', '低收入戶'];

    const Card = ({ title, value, colorClass = "bg-white" }) => (
      <div className="flex flex-col items-center p-1 bg-white border border-blue-800 rounded shadow-sm w-full">
        <div className="text-[10px] font-bold text-black whitespace-nowrap mb-1">{title}</div>
        <div className={`text-sm font-bold px-1 border border-black w-full text-center truncate ${colorClass}`}>
          {value}
        </div>
      </div>
    );

    const Button = ({ children, onClick, className }) => (
      <button onClick={onClick} className={`px-2 py-1.5 rounded text-white font-bold text-xs shadow active:scale-95 transition-transform flex items-center justify-center gap-1 whitespace-nowrap min-w-fit ${className}`}>
        {children}
      </button>
    );

    function App() {
      const [isLoading, setIsLoading] = useState(true);
      const [db, setDb] = useState({ equip: [], disConst: [], ltcConst: [], lastUpdate: '' });
      const [disabilityStatus, setDisabilityStatus] = useState('');
      const [ltcStatus, setLtcStatus] = useState('');
      const [equipRows, setEquipRows] = useState([{ id: 1, productId: '', ltcChecked: false, disChecked: false }]);
      const [ltcConstRows, setLtcConstRows] = useState([{ id: 201, productId: '', quantity: 1 }]);
      const [disConstRows, setDisConstRows] = useState([{ id: 301, productId: '', quantity: 1 }]);
      const [constApplyMode, setConstApplyMode] = useState('LTC');
      const [isEquipOpen, setIsEquipOpen] = useState(true);

      useEffect(() => {
        const fetchData = async () => {
          try {
            const fetchCsv = async (url) => {
              const res = await fetch(url);
              if (!res.ok) throw new Error("網路請求失敗");
              const text = await res.text();
              return text.split(/\r?\n/).map(line => line.split(','));
            };

            const [rawEq, rawDis, rawLtc] = await Promise.all([
              fetchCsv(CSV_URLS.EQUIP), fetchCsv(CSV_URLS.DIS_CONST), fetchCsv(CSV_URLS.LTC_CONST)
            ]);

            const equip = rawEq.slice(2).filter(r => r[0]).map((r, i) => ({
              id: `p${i}`, name: r[0],
              prices: {
                disability: { '一般戶': +r[1]||0, '中低收': +r[2]||0, '低收入戶': +r[3]||0 },
                ltc: { '一般戶': +r[4]||0, '中低收': +r[5]||0, '低收入戶': +r[6]||0 }
              },
              years: r[7] || '-', ltcQuota: +r[6] || 0
            }));

            const parseC = (raw) => raw.slice(1).filter(r => r[0]).map((r, i) => ({
              id: `c${i}`, name: r[0], prices: { '一般戶': +r[1]||0, '中低收': +r[2]||0, '低收入戶': +r[3]||0 }, quota: +r[3]||0
            }));

            const finalDb = { equip, disConst: parseC(rawDis), ltcConst: parseC(rawLtc), lastUpdate: new Date().toLocaleString() };
            localStorage.setItem('subsidy_db_backup', JSON.stringify(finalDb));
            setDb(finalDb);
            setIsLoading(false);
          } catch (e) {
            const backup = localStorage.getItem('subsidy_db_backup');
            if (backup) {
              setDb(JSON.parse(backup));
              setIsLoading(false);
            } else {
              alert("首次使用需連網同步資料");
            }
          }
        };
        fetchData();
      }, []);

      const calculatedEquipRows = useMemo(() => {
        return equipRows.map(row => {
          const p = db.equip.find(x => x.id === row.productId);
          if (!p || !disabilityStatus || !ltcStatus) return { ...row, ltcP: 0, disP: 0, q: 0, years: '-', diff: 0, name: '' };
          const lp = p.prices.ltc[ltcStatus];
          const dp = p.prices.disability[disabilityStatus];
          return {
            ...row, ltcP: lp, disP: dp, q: p.ltcQuota, years: p.years, diff: lp - dp,
            activeL: row.ltcChecked ? lp : 0, activeD: row.disChecked ? dp : 0, activeQ: row.ltcChecked ? p.ltcQuota : 0
          };
        });
      }, [equipRows, disabilityStatus, ltcStatus, db.equip]);

      const totals = useMemo(() => {
        const eT = calculatedEquipRows.reduce((acc, r) => ({
          d: acc.d + (r.activeD || 0), l: acc.l + (r.activeL || 0), q: acc.q + (r.activeQ || 0)
        }), { d: 0, l: 0, q: 0 });
        const lS = ltcConstRows.reduce((acc, r) => {
          const p = db.ltcConst.find(x => x.id === r.productId);
          const pr = p ? p.prices[ltcStatus] * r.quantity : 0;
          const qo = p ? p.quota * r.quantity : 0;
          return { p: acc.p + pr, q: acc.q + qo };
        }, { p: 0, q: 0 });
        const dS = disConstRows.reduce((acc, r) => {
          const p = db.disConst.find(x => x.id === r.productId);
          return acc + (p ? p.prices[disabilityStatus] * r.quantity : 0);
        }, 0);
        let cLp = 0, cDp = 0, cQo = 0;
        if (constApplyMode === 'LTC') { cLp = lS.p; cQo = lS.q; } else { cDp = dS; }
        return { disTotal: eT.d + cDp, ltcTotal: eT.l + cLp, quotaTotal: eT.q + cQo, lConstSub: lS.p, dConstSub: dS };
      }, [calculatedEquipRows, ltcConstRows, disConstRows, constApplyMode, ltcStatus, disabilityStatus, db]);

      const constDiff = totals.lConstSub - totals.dConstSub;
      let diffText = "金額相同", diffColorClass = "text-gray-500";
      if (constDiff > 0) { diffText = `長照較優 (+${constDiff})`; diffColorClass = "text-blue-700 font-bold"; }
      else if (constDiff < 0) { diffText = `身障較優 (${constDiff})`; diffColorClass = "text-green-700 font-bold"; }

      const handleEquipCheck = (id, field) => {
        setEquipRows(equipRows.map(r => {
          if (r.id === id) {
            const val = !r[field];
            return { ...r, [field]: val, 
              ...(val && field === 'ltcChecked' ? { disChecked: false } : {}),
              ...(val && field === 'disChecked' ? { ltcChecked: false } : {})
            };
          }
          return r;
        }));
      };

      const clearAll = () => {
        setDisabilityStatus(''); setLtcStatus('');
        setEquipRows([{ id: Date.now(), productId: '', ltcChecked: false, disChecked: false }]);
        setLtcConstRows([{ id: Date.now()+1, productId: '', quantity: 1 }]);
        setDisConstRows([{ id: Date.now()+2, productId: '', quantity: 1 }]);
      };

      const handleScreenshot = () => {
        window.scrollTo(0, 0);
        htmlToImage.toPng(document.getElementById('main-content'), { quality: 1, backgroundColor: '#f3f4f6' })
          .then(url => { const l = document.createElement('a'); l.download = `試算表_${new Date().toLocaleDateString()}.png`; l.href = url; l.click(); });
      };

      if (isLoading) return (
        <div className="h-screen flex flex-col items-center justify-center bg-gray-900 text-white">
          <RefreshCw size={48} className="mb-4 text-blue-400 loading-spin" />
          <p className="text-lg font-bold">同步雲端資料庫中...</p>
        </div>
      );

      return (
        <div className="bg-gray-100 font-sans min-h-screen">
          <div id="orientation-lock" className="fixed inset-0 z-[9999] bg-gray-900 text-white flex flex-col items-center justify-center p-8 text-center portrait:flex landscape:hidden">
             <RefreshCw className="mb-6 text-yellow-400 animate-pulse" />
             <h2 className="text-xl font-bold mb-4">請旋轉裝置</h2>
             <p className="text-base text-gray-300">本系統僅支援橫向模式使用。</p>
             <Smartphone className="mt-8 text-gray-700 rotate-90" />
          </div>

          <div className="portrait:hidden landscape:block w-full px-2" id="main-content">
            <div className="sticky top-0 z-50 bg-white rounded-lg shadow-md mb-3 border border-gray-200 mt-2 overflow-hidden">
              <div className="bg-blue-600 text-white p-1 text-center font-bold text-sm">身障/長照 補助計算機 V31</div>
              <div className="p-2">
                <div className="flex items-end gap-2 mb-2">
                  <div className="w-32"><label className="font-bold text-[10px] block">身障經濟別</label>
                    <select className="w-full border rounded p-1 text-xs h-8" value={disabilityStatus} onChange={e => setDisabilityStatus(e.target.value)}><option value="">請選擇</option>{ECON_STATUS.map(s => <option key={s} value={s}>{s}</option>)}</select>
                  </div>
                  <div className="w-32"><label className="font-bold text-[10px] block">長照經濟別</label>
                    <select className="w-full border rounded p-1 text-xs h-8" value={ltcStatus} onChange={e => setLtcStatus(e.target.value)}><option value="">請選擇</option>{ECON_STATUS.map(s => <option key={s} value={s}>{s}</option>)}</select>
                  </div>
                  <div className="flex gap-1 flex-1">
                    <Card title="身障總金額" value={totals.disTotal} />
                    <Card title="長照總金額" value={totals.ltcTotal} />
                    <Card title="總補助" value={totals.disTotal + totals.ltcTotal} />
                    <Card title="長照占用額度" value={totals.quotaTotal} />
                  </div>
                </div>
                <div className="flex flex-wrap gap-1">
                   <Button onClick={() => setEquipRows([{id:1,productId:'',ltcChecked:false,disChecked:false}])} className="bg-gray-600">輔具清除</Button>
                   <Button onClick={() => {setLtcConstRows([{id:201,productId:'',quantity:1}]); setDisConstRows([{id:301,productId:'',quantity:1}]);}} className="bg-orange-600">無障礙清除</Button>
                   <Button onClick={clearAll} className="bg-red-600">總清除</Button>
                   <Button onClick={handleScreenshot} className="bg-purple-600 ml-auto">一鍵截圖</Button>
                </div>
              </div>
            </div>

            <div className="mb-3 bg-white rounded-lg shadow-sm border border-blue-200 overflow-hidden">
               <div className="bg-blue-100 p-1.5 flex justify-between items-center font-bold text-blue-900 text-xs cursor-pointer" onClick={() => setIsEquipOpen(!isEquipOpen)}>
                  <span>輔具清單 (同步：{db.lastUpdate || '離線'})</span>
                  <button onClick={(e) => {e.stopPropagation(); setEquipRows([...equipRows, {id: Date.now(), productId: '', ltcChecked: false, disChecked: false}]);}} className="bg-green-600 text-white px-2 py-0.5 rounded text-[10px]">+ 新增項目</button>
               </div>
               {isEquipOpen && (
                 <div>
                   <div className="flex bg-blue-50 text-[9px] font-bold p-1 border-b text-center text-blue-900">
                      <div className="w-[22%] text-left pl-1">項目名稱</div>
                      <div className="w-[6%]">長照</div><div className="w-[11%]">長照$</div>
                      <div className="w-[6%]">身障</div><div className="w-[11%]">身障$</div>
                      <div className="w-[8%] text-blue-700">年限</div>
                      <div className="w-[12%]">差額</div><div className="w-[12%]">占用額度</div><div className="w-[12%]">操作</div>
                   </div>
                   {calculatedEquipRows.map(row => (
                      <div key={row.id} className="flex items-center text-[10px] p-1 border-b gap-0.5 hover:bg-blue-50/50">
                        <div className="w-[22%] p-0.5"><select className="w-full border rounded p-0.5 h-7" value={row.productId} onChange={e => setEquipRows(equipRows.map(r => r.id === row.id ? {...r, productId: e.target.value} : r))}><option value="">請選擇輔具</option>{db.equip.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
                        <div className="w-[6%] flex justify-center"><button onClick={() => handleEquipCheck(row.id, 'ltcChecked')}>{row.ltcChecked ? <CheckSquare className="text-blue-600"/> : <Square className="text-gray-300"/>}</button></div>
                        <div className="w-[11%] border rounded py-1 text-center bg-gray-50 truncate">{row.ltcP}</div>
                        <div className="w-[6%] flex justify-center"><button onClick={() => handleEquipCheck(row.id, 'disChecked')}>{row.disChecked ? <CheckSquare className="text-green-600"/> : <Square className="text-gray-300"/>}</button></div>
                        <div className="w-[11%] border rounded py-1 text-center bg-gray-50 truncate">{row.disP}</div>
                        <div className="w-[8%] text-center font-bold text-blue-600 truncate">{row.years}</div>
                        <div className="w-[12%] border rounded py-1 text-center bg-gray-50 truncate">{row.diff}</div>
                        <div className="w-[12%] border rounded py-1 text-center bg-gray-50 truncate">{row.q}</div>
                        <div className="w-[12%] flex justify-center"><button onClick={() => setEquipRows(equipRows.filter(r => r.id !== row.id))} className="text-red-500"><Trash2 size={16}/></button></div>
                      </div>
                   ))}
                 </div>
               )}
            </div>

            <div className="mb-3 bg-white rounded-lg shadow-sm border border-gray-200 p-2 flex flex-wrap items-center gap-2">
               <div className="flex items-center gap-2 mr-auto">
                   <span className="text-xs font-bold text-gray-700">無障礙管道：</span>
                   <div className="flex items-center gap-1 border border-gray-300 px-2 py-1 rounded bg-gray-50">
                      <Info size={12} className="text-gray-500" />
                      <span className={`text-[10px] ${diffColorClass}`}>{diffText}</span>
                   </div>
               </div>
               <div className="flex items-center gap-3">
                  <label className="flex items-center gap-1 cursor-pointer" onClick={() => setConstApplyMode('LTC')}>
                    {constApplyMode === 'LTC' ? <CheckCircle className="text-blue-600" /> : <Circle className="text-gray-300" />}
                    <span className={`text-xs font-bold ${constApplyMode === 'LTC' ? 'text-blue-700' : 'text-gray-500'}`}>從長照申請</span>
                  </label>
                  <label className="flex items-center gap-1 cursor-pointer" onClick={() => setConstApplyMode('DISABILITY')}>
                    {constApplyMode === 'DISABILITY' ? <CheckCircle className="text-green-600" /> : <Circle className="text-gray-300" />}
                    <span className={`text-xs font-bold ${constApplyMode === 'DISABILITY' ? 'text-green-700' : 'text-gray-500'}`}>從身障申請</span>
                  </label>
               </div>
            </div>

            <div className="grid grid-cols-2 gap-2 mb-10">
               <div className="bg-white rounded-lg shadow-sm border border-blue-300 overflow-hidden">
                  <div className="bg-blue-50 p-1.5 flex justify-between font-bold text-blue-800 text-xs"><span>長照無障礙項目</span><button onClick={() => setLtcConstRows([...ltcConstRows, {id:Date.now(), productId:'', quantity:1}])} className="bg-blue-600 text-white px-1.5 rounded">+</button></div>
                  {ltcConstRows.map(r => (
                    <div key={r.id} className="flex p-1 border-b gap-1 items-center">
                      <select className="flex-1 border text-[10px] h-7" value={r.productId} onChange={e => setLtcConstRows(ltcConstRows.map(x=>x.id===r.id?{...x, productId:e.target.value}:x))}><option value="">請選擇</option>{db.ltcConst.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select>
                      <input type="number" className="w-10 border text-[10px] text-center h-7" value={r.quantity} onChange={e => setLtcConstRows(ltcConstRows.map(x=>x.id===r.id?{...x, quantity:+e.target.value}:x))} />
                      <button onClick={() => setLtcConstRows(ltcConstRows.filter(x=>x.id!==r.id))} className="text-red-400"><Trash2 size={14}/></button>
                    </div>
                  ))}
               </div>
               <div className="bg-white rounded-lg shadow-sm border border-green-300 overflow-hidden">
                  <div className="bg-green-50 p-1.5 flex justify-between font-bold text-green-800 text-xs"><span>身障無障礙項目</span><button onClick={() => setDisConstRows([...disConstRows, {id:Date.now(), productId:'', quantity:1}])} className="bg-green-600 text-white px-1.5 rounded">+</button></div>
                  {disConstRows.map(r => (
                    <div key={r.id} className="flex p-1 border-b gap-1 items-center">
                      <select className="flex-1 border text-[10px] h-7" value={r.productId} onChange={e => setDisConstRows(disConstRows.map(x=>x.id===r.id?{...x, productId:e.target.value}:x))}><option value="">請選擇</option>{db.disConst.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select>
                      <input type="number" className="w-10 border text-[10px] text-center h-7" value={r.quantity} onChange={e => setDisConstRows(disConstRows.map(x=>x.id===r.id?{...x, quantity:+e.target.value}:x))} />
                      <button onClick={() => setDisConstRows(disConstRows.filter(x=>x.id!==r.id))} className="text-red-400"><Trash2 size={14}/></button>
                    </div>
                  ))}
               </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }
  </script>
</body>
</html>
